<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>72+ Golf Academy - Web App Học Viên (First Swing K01)</title>
  <!-- Google Fonts: Work Sans & Raleway (Website Official Typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile App Frame Container -->
  <div id="app-root">
    
    <!-- Top Header with Official Logo PNG -->
    <header class="app-header">
      <div class="brand-badge">
        <img src="assets/logo-white.png" alt="72+ Golf Academy - The Real School For Golfers" class="brand-logo-img">
      </div>
      <div class="user-avatar-btn" onclick="document.querySelector('[data-tab=profile]').click()" title="Hồ sơ học viên">
        AN
      </div>
    </header>

    <!-- Signature Diagonal Slash Motif -->
    <div class="slash-motif"></div>

    <!-- Main Content Container -->
    <main style="flex: 1;">
      
      <!-- Tab 1: Trang Chủ & Chính Sách -->
      <section id="tab-dashboard" class="tab-content active"></section>

      <!-- Tab 2: Lộ Trình (23 Buổi + 1 Buổi 3D + 1 Buổi 1-1) -->
      <section id="tab-schedule" class="tab-content"></section>

      <!-- Tab 3: Học Liệu 24 Buổi (Text + Image + Short Video) -->
      <section id="tab-curriculum" class="tab-content"></section>

      <!-- Tab 4: Bài Kiểm Tra Kiến Thức Tổng Hợp -->
      <section id="tab-quizzes" class="tab-content"></section>

      <!-- Tab 5: Hồ Sơ, Testimonial & Giới Thiệu -->
      <section id="tab-profile" class="tab-content"></section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="dashboard">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Trang Chủ</span>
      </button>

      <button class="nav-item" data-tab="schedule">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
        <span>Lộ Trình</span>
      </button>

      <button class="nav-item" data-tab="curriculum">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        <span>Học Liệu</span>
      </button>

      <button class="nav-item" data-tab="quizzes">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Bài Test</span>
      </button>

      <button class="nav-item" data-tab="profile">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Hồ Sơ</span>
      </button>
    </nav>

  </div>

  <!-- Session Detail Modal -->
  <div id="session-detail-modal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeSessionDetailModal()">&times;</button>
      <div id="session-detail-body"></div>
    </div>
  </div>

  <!-- Quiz Execution Modal -->
  <div id="quiz-modal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeQuizModal()">&times;</button>
      <div id="quiz-modal-body"></div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="curriculum-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
